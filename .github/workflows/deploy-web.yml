name: Deploy Web

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'scripts/deploy-web-munnies'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: munnies-web-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web app
        working-directory: web
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/362335167892/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: munnies-web-deployer@munnies-489414.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: munnies-489414

      - name: Deploy Cloud Run service
        run: ./scripts/deploy-web-munnies
